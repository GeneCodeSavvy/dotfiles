# Use a clean, breathable format
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$custom\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold #118dc3"
format = "[$path]($style) "
truncation_length = 3

[character]
success_symbol = "[❯](bold #9a77cf)"
error_symbol = "[❯](bold #e05661)"
vimcmd_symbol = "[❮](bold #2d8a22)"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = "󰊢 "
style = "bold #2d8a22"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](bold #e05661) ($ahead_behind$stashed)]($style)"
style = "italic #118dc3"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "took [$duration]($style) "
style = "#5c6370"

[python]
format = "via [󱔎 $virtualenv]($style) "
style = "#2d8a22"

[line_break]
disabled = false

[custom.nix_shell_name]
command = "printf %s \"$NIX_SHELL_NAME\""
when = "test -n \"$NIX_SHELL_NAME\""
format = "via [󱄅 $output]($style) "
style = "#2d8a22"
